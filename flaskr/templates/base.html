<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>{% block tilte %}FLASK SNS{% endblock %}</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="{{ url_for('app.home') }}"></a>
                ホーム
            </a>
            {% if current_user.is_authenticated %}
                <a class="navbar-brand" href="{{ url_for('app.logout') }}">
                    ログアウト
                </a>
            {% else %}
                <a class="navbar-brand" href="{{ url_for('app.login') }}">
                    ログイン
                </a>
                <a class="navbar-brand" href="{{ url_for('app.register') }}">
                    登録
                </a>
            {% endif %}
        </nav>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
